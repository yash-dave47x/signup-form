<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="logo">
        <img src="./images/img.jpg" alt="" class="img" />
        <div class="odin">
          <img src="./images/odin.png" alt="not found" class="odinimg" />
          <div>odin</div>
        </div>
      </div>
      <div class="content">
        <div class="about">
          <div class="main-heading">
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
          </div>
          <div class="sub-heading">You know you want to.</div>
        </div>
        <div class="form-container">
          <div class="form">
            <form action="#">
              <fieldset class="form-body">
                <legend>Let's do this!</legend>

                <label for="firstName">FIRST NAME</label>
                <input type="text" name="firstName" id="firstName" />

                <label for="lastName">LAST NAME</label>
                <input type="text" name="lastName" id="lastName" />

                <label for="email">EMAIL</label>
                <input type="email" name="email" id="email" />

                <label for="phNo">PHONE NUMBER</label>
                <input type="number" name="phNo" id="phNo" />

                <label for="password">PASSWORD</label>
                <input type="password" name="password" id="password" />

                <label for="cnfPassword">CONFITRM PASSWORD</label>
                <input type="password" name="cnfPassword" id="cnfPassword" />
              </fieldset>

              <button class="btn" type="submit">Create Account</button>
            </form>
          </div>
          <div class="login">
            Already have an account? <a href="" class="loginBtn">Log in</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
